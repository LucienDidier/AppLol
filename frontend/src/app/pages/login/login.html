<div class="signup-page">
	<section class="signup-panel" aria-labelledby="signup-title">
		<div class="eyebrow"></div>
		<h1 id="signup-title">Connexion</h1>

		<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
			<label class="field">
				<span>Nom</span>
				<input
					id="name"
					type="text"
					formControlName="name"
					autocomplete="name"
					maxlength="80"
				/>
				
			</label>

			<label class="field">
				<span>Adresse e-mail</span>
				<input
					id="email"
					type="email"
					formControlName="email"
					autocomplete="email"
					maxlength="254"
				/>
			</label>

			<label class="field">
				<span>Mot de passe</span>
				<input
					id="password"
					type="password"
					formControlName="password"
					autocomplete="new-password"
					maxlength="128"
				/>
			</label>

			<button type="submit" [disabled]="isSubmitting">
				{{ isSubmitting ? 'Inscription en cours…' : 'Créer mon compte' }}
			</button>
		</form>

		@if (successMessage) {
			<p class="feedback success" role="status">{{ successMessage }}</p>
		}
		@if (errorMessage) {
			<p class="feedback error" role="alert">{{ errorMessage }}</p>
		}
	</section>
</div>
